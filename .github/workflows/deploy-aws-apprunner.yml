name: Deploy Hephaestus to AWS App Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: hephaestus-international
  ECR_REPOSITORY: hephaestus-international

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hephaestus-deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975049954782:role/hephaestus-international-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="git-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          LATEST_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${LATEST_URI}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Fetch Strapi URL for build
        id: build-config
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_STRAPI_URL=$(aws ssm get-parameter --name /hephaestus-international/CONTENT_STRAPI_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          echo "content_strapi_url<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTENT_STRAPI_URL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.latest_uri }}
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_COMMIT_REF=${{ github.ref_name }}
            BUILD_IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
            NEXT_PUBLIC_STRAPI_URL=${{ steps.build-config.outputs.content_strapi_url }}

      - name: Resolve ECR image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${AWS_REGION}")
          if [[ -z "$DIGEST" || "$DIGEST" == "None" ]]; then
            echo "Could not resolve image digest from ECR" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve runtime secrets from AWS SSM
        id: runtime-secrets
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(aws ssm get-parameter --name /flolabs-chronos/DATABASE_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          CHRONOS_SYNC_API_URL=$(aws ssm get-parameter --name /hephaestus-international/CHRONOS_SYNC_API_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          CONTENT_STRAPI_URL=$(aws ssm get-parameter --name /hephaestus-international/CONTENT_STRAPI_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          STRAPI_API_TOKEN=$(aws ssm get-parameter --name /hephaestus-international/STRAPI_API_TOKEN --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          CONTENT_STRAPI_API_TOKEN=$(aws ssm get-parameter --name /hephaestus-international/CONTENT_STRAPI_API_TOKEN --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          CHRONOS_SYNC_TOKEN=$(aws ssm get-parameter --name /hephaestus-international/CHRONOS_SYNC_TOKEN --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          EMAIL_FROM=$(aws ssm get-parameter --name /flolabs-chronos/EMAIL_FROM --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          RESEND_API_KEY=$(aws ssm get-parameter --name /flolabs-chronos/RESEND_API_KEY --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          NOTION_API_KEY=$(aws ssm get-parameter --name /flolabs-chronos/NOTION_API_KEY --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          CRON_SECRET=$(aws ssm get-parameter --name /flolabs-chronos/CRON_SECRET --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          OPENAI_API_KEY=$(aws ssm get-parameter --name /flolabs-chronos/OPENAI_API_KEY --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          {
            echo "database_url<<EOF"
            echo "$DATABASE_URL"
            echo "EOF"
            echo "chronos_sync_api_url<<EOF"
            echo "$CHRONOS_SYNC_API_URL"
            echo "EOF"
            echo "content_strapi_url<<EOF"
            echo "$CONTENT_STRAPI_URL"
            echo "EOF"
            echo "strapi_api_token<<EOF"
            echo "$STRAPI_API_TOKEN"
            echo "EOF"
            echo "content_strapi_api_token<<EOF"
            echo "$CONTENT_STRAPI_API_TOKEN"
            echo "EOF"
            echo "chronos_sync_token<<EOF"
            echo "$CHRONOS_SYNC_TOKEN"
            echo "EOF"
            echo "email_from<<EOF"
            echo "$EMAIL_FROM"
            echo "EOF"
            echo "resend_api_key<<EOF"
            echo "$RESEND_API_KEY"
            echo "EOF"
            echo "notion_api_key<<EOF"
            echo "$NOTION_API_KEY"
            echo "EOF"
            echo "cron_secret<<EOF"
            echo "$CRON_SECRET"
            echo "EOF"
            echo "openai_api_key<<EOF"
            echo "$OPENAI_API_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render App Runner source configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > apprunner-source.json <<JSON
          {
            "AuthenticationConfiguration": {
              "AccessRoleArn": "arn:aws:iam::975049954782:role/hephaestus-international-apprunner-ecr-access-role"
            },
            "AutoDeploymentsEnabled": true,
            "ImageRepository": {
              "ImageIdentifier": "${{ steps.meta.outputs.image_uri }}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "APP_URL": "https://fykgssqbvg.us-east-1.awsapprunner.com",
                  "APPLICANT_STORAGE_DRIVER": "postgres",
                  "NODE_ENV": "production",
                  "NEXTAUTH_URL": "https://fykgssqbvg.us-east-1.awsapprunner.com",
                  "NEXTAUTH_SECRET": "${{ secrets.AUTH_SECRET }}",
                  "DATABASE_URL": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "CHRONOS_DB_DATABASE_URL": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "FL_CHRONOS_DATABASE_URL": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "CHRONOS_SYNC_API_URL": "${{ steps.runtime-secrets.outputs.chronos_sync_api_url }}",
                  "CHRONOS_SYNC_TOKEN": "${{ steps.runtime-secrets.outputs.chronos_sync_token }}",
                  "CONTENT_STRAPI_URL": "${{ steps.runtime-secrets.outputs.content_strapi_url }}",
                  "CONTENT_STRAPI_API_TOKEN": "${{ steps.runtime-secrets.outputs.content_strapi_api_token }}",
                  "NEXT_PUBLIC_STRAPI_URL": "${{ steps.runtime-secrets.outputs.content_strapi_url }}",
                  "STRAPI_API_TOKEN": "${{ steps.runtime-secrets.outputs.strapi_api_token }}",
                  "RESEND_API_KEY": "${{ steps.runtime-secrets.outputs.resend_api_key }}",
                  "EMAIL_FROM": "${{ steps.runtime-secrets.outputs.email_from }}",
                  "NOTION_API_KEY": "${{ steps.runtime-secrets.outputs.notion_api_key }}",
                  "CRON_SECRET": "${{ steps.runtime-secrets.outputs.cron_secret }}",
                  "NOTION_TEAM_MEMBERS_DB_ID": "286a1576955180d6acdec21f7a45dfcc",
                  "OPENAI_API_KEY": "${{ steps.runtime-secrets.outputs.openai_api_key }}",
                  "BUILD_COMMIT_SHA": "${{ github.sha }}",
                  "BUILD_COMMIT_REF": "${{ github.ref_name }}",
                  "BUILD_IMAGE_TAG": "${{ steps.meta.outputs.image_tag }}",
                  "BUILD_IMAGE_DIGEST": "${{ steps.digest.outputs.digest }}",
                  "BUILD_TIMESTAMP": "${{ steps.meta.outputs.build_timestamp }}"
                }
              }
            }
          }
          JSON

      - name: Render App Runner instance configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > apprunner-service.json <<JSON
          {
            "Cpu": "1 vCPU",
            "Memory": "2 GB"
          }
          JSON

      - name: Wait for App Runner to become idle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            SERVICE_STATUS=$(aws apprunner describe-service \
              --service-arn "arn:aws:apprunner:us-east-1:975049954782:service/hephaestus-international/7b3d7cb4f0894c21ae16f15b985fedc7" \
              --region "${AWS_REGION}" \
              --query 'Service.Status' \
              --output text)
            LATEST_OPERATION_STATUS=$(aws apprunner list-operations \
              --service-arn "arn:aws:apprunner:us-east-1:975049954782:service/hephaestus-international/7b3d7cb4f0894c21ae16f15b985fedc7" \
              --region "${AWS_REGION}" \
              --max-results 1 \
              --query 'OperationSummaryList[0].Status' \
              --output text)
            echo "App Runner idle check: service=${SERVICE_STATUS} latestOperation=${LATEST_OPERATION_STATUS} attempt=${attempt}/60"
            if [[ "$SERVICE_STATUS" == "RUNNING" && "$LATEST_OPERATION_STATUS" != "IN_PROGRESS" && "$LATEST_OPERATION_STATUS" != "PENDING" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "App Runner never became idle before update attempt" >&2
          exit 1

      - name: Update App Runner service
        id: update
        shell: bash
        run: |
          set -euo pipefail
          OPERATION_ID=$(aws apprunner update-service \
            --service-arn "arn:aws:apprunner:us-east-1:975049954782:service/hephaestus-international/7b3d7cb4f0894c21ae16f15b985fedc7" \
            --source-configuration file://apprunner-source.json \
            --instance-configuration file://apprunner-service.json \
            --network-configuration "EgressConfiguration={EgressType=VPC,VpcConnectorArn=arn:aws:apprunner:us-east-1:975049954782:vpcconnector/flolabs-chronos-vpc-connector/1/41208035860d463f92e083af41247fe1}" \
            --region "${AWS_REGION}" \
            --query 'OperationId' \
            --output text)
          echo "operation_id=${OPERATION_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for App Runner operation
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            STATUS=$(aws apprunner list-operations \
              --service-arn "arn:aws:apprunner:us-east-1:975049954782:service/hephaestus-international/7b3d7cb4f0894c21ae16f15b985fedc7" \
              --region "${AWS_REGION}" \
              --query "OperationSummaryList[?Id=='${{ steps.update.outputs.operation_id }}'].Status | [0]" \
              --output text)
            echo "App Runner operation status: $STATUS"
            if [[ "$STATUS" == "SUCCEEDED" ]]; then
              break
            fi
            if [[ "$STATUS" != "IN_PROGRESS" && "$STATUS" != "PENDING" ]]; then
              echo "Deployment failed with status: $STATUS" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify health endpoint and build metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://fykgssqbvg.us-east-1.awsapprunner.com"
          for attempt in {1..45}; do
            BODY=""
            if BODY=$(curl -fsSL --connect-timeout 10 --max-time 25 "${APP_URL}/api/health" 2>/dev/null); then
              echo "$BODY"
              if echo "$BODY" | grep -F '"ok":true' >/dev/null && \
                 echo "$BODY" | grep -F '"commitSha":"${{ github.sha }}"' >/dev/null; then
                exit 0
              fi
            else
              echo "health fetch failed or timed out (attempt ${attempt}/45)"
            fi
            sleep 10
          done
          echo "Timed out waiting for health metadata to match commit ${{ github.sha }}" >&2
          exit 1

  e2e:
    name: E2E smoke tests
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: https://fykgssqbvg.us-east-1.awsapprunner.com
        run: npx playwright test --config playwright.config.ts --reporter=list,html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
