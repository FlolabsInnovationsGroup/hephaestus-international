version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: hephaestus-international
    EC2_INSTANCE_ID: i-0292b7ec02f26a25b
    PRODUCTION_URL: https://efestos.international

phases:
  pre_build:
    commands:
      - set -eu
      - COMMIT_SHA="${GIT_SHA:-${CODEBUILD_RESOLVED_SOURCE_VERSION}}"
      - SHORT_SHA="$(printf '%.12s' "$COMMIT_SHA")"
      - IMAGE_TAG="git-${SHORT_SHA}"
      - ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
      - LATEST_URI="${REGISTRY}/${ECR_REPOSITORY}:latest"
      - BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "COMMIT_SHA=${COMMIT_SHA}" > /tmp/build.env
      - echo "IMAGE_TAG=${IMAGE_TAG}" >> /tmp/build.env
      - echo "IMAGE_URI=${IMAGE_URI}" >> /tmp/build.env
      - echo "LATEST_URI=${LATEST_URI}" >> /tmp/build.env
      - echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> /tmp/build.env
      - echo "REGISTRY=${REGISTRY}" >> /tmp/build.env
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - export CONTENT_STRAPI_URL="$(aws ssm get-parameter --name /hephaestus-international/CONTENT_STRAPI_URL --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"

  build:
    commands:
      - set -eu
      - . /tmp/build.env && export COMMIT_SHA IMAGE_TAG IMAGE_URI LATEST_URI BUILD_TIMESTAMP REGISTRY
      - |
        docker build \
          --build-arg BUILD_COMMIT_SHA="$COMMIT_SHA" \
          --build-arg BUILD_COMMIT_REF=main \
          --build-arg BUILD_IMAGE_TAG="$IMAGE_TAG" \
          --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          --build-arg NEXT_PUBLIC_STRAPI_URL="$CONTENT_STRAPI_URL" \
          -t "$IMAGE_URI" \
          -t "$LATEST_URI" \
          ./frontend
      - docker push "$IMAGE_URI"
      - docker push "$LATEST_URI"

  post_build:
    commands:
      - set -eu
      - . /tmp/build.env && export COMMIT_SHA IMAGE_TAG IMAGE_URI LATEST_URI BUILD_TIMESTAMP REGISTRY
      - |
        python3 - <<'PYEOF'
        import subprocess, json, os, time, sys
        aws_region = os.environ["AWS_REGION"]
        registry = os.environ["REGISTRY"]
        latest_uri = os.environ["LATEST_URI"]
        commit_sha = os.environ["COMMIT_SHA"]
        instance_id = os.environ["EC2_INSTANCE_ID"]
        commands = [
            f"aws ecr get-login-password --region {aws_region} | docker login --username AWS --password-stdin {registry}",
            "docker image prune -f",
            f"docker pull {latest_uri}",
            "cd /opt/hosting && docker compose up -d --force-recreate hephaestus",
        ]
        r = subprocess.run(
            ["aws", "ssm", "send-command",
             "--instance-ids", instance_id,
             "--document-name", "AWS-RunShellScript",
             "--parameters", json.dumps({"commands": commands}),
             "--region", aws_region,
             "--query", "Command.CommandId",
             "--output", "text"],
            capture_output=True, text=True, check=True)
        cmd_id = r.stdout.strip()
        print(f"SSM CommandId: {cmd_id}")
        for attempt in range(1, 61):
            try:
                s = subprocess.run(
                    ["aws", "ssm", "get-command-invocation",
                     "--command-id", cmd_id,
                     "--instance-id", instance_id,
                     "--region", aws_region,
                     "--query", "Status",
                     "--output", "text"],
                    capture_output=True, text=True, check=True)
                status = s.stdout.strip()
            except subprocess.CalledProcessError:
                status = "Pending"
            print(f"SSM status={status} attempt={attempt}")
            if status == "Success":
                break
            if status in ("Failed", "TimedOut", "Cancelled"):
                print("EC2 deploy failed", file=sys.stderr)
                sys.exit(1)
            time.sleep(10)
        PYEOF
      - |
        for attempt in $(seq 1 30); do
          BODY="$(curl -fsSL --connect-timeout 10 --max-time 25 "${PRODUCTION_URL}/api/health" || true)"
          echo "$BODY"
          if echo "$BODY" | grep -F '"ok":true' >/dev/null && echo "$BODY" | grep -F "${COMMIT_SHA}" >/dev/null; then
            exit 0
          fi
          sleep 10
        done
        exit 1
