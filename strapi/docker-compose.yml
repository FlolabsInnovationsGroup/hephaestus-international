services:
  postgres:
    image: postgres:16-alpine
    container_name: hephaestus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: hephaestus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    networks:
      - strapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    image: node:18-alpine
    container_name: hephaestus-strapi
    restart: unless-stopped
    working_dir: /srv/app
    command: sh -c "npm install && npm run develop"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hephaestus
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: false
      JWT_SECRET: ${JWT_SECRET:-changeme-generate-secure-secret}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-changeme-generate-secure-admin-secret}
      APP_KEYS: ${APP_KEYS:-changeme-generate-app-keys}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-changeme-generate-token-salt}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-changeme-generate-transfer-salt}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      FRONTEND_URL: http://localhost:3001
    volumes:
      - ./app:/srv/app
      - /srv/app/node_modules
      - strapi-uploads:/srv/app/public/uploads
    ports:
      - '1337:1337'
    networks:
      - strapi-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  strapi-uploads:

networks:
  strapi-network:
    driver: bridge
